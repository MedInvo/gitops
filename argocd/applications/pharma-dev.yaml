
---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: pharma-dev
  namespace: argocd
spec:
  project: pharma-project

  source:
    repoURL: https://github.com/MedInvo/gitops.git
    targetRevision: main
    path: charts/pharma-app
    helm:
      valueFiles:
        - values.yaml
        - values-dev.yaml

  destination:
    server: https://kubernetes.default.svc
    namespace: pharma-app

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
