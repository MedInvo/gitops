apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: pharma-shared-dev
  namespace: argocd
spec:
  project: pharma-project
  source:
    repoURL: https://github.com/MedInvo/gitops.git
    targetRevision: main
    path: charts/pharma-shared
    helm:
      releaseName: pharma-dev
      valueFiles:
        - values.yaml
        - values-dev.yaml
  destination:
    server: https://kubernetes.default.svc
    namespace: pharma-app
  syncPolicy:
    syncOptions:
      - CreateNamespace=true
