apiVersion: v1
kind: Service
metadata:
  name: order-service
  namespace: {{ .Values.namespace.name }}
  labels:
    {{- include "pharma-app.labels" . | nindent 4 }}

spec:
  selector:
    app: order-service

  ports:
    - name: http
      protocol: TCP
      port: {{ .Values.orderService.service.port }}
      targetPort: {{ .Values.orderService.service.targetPort }}

  type: ClusterIP