apiVersion: apps/v1
kind: Deployment
metadata:
  name: product-service
  namespace: {{ .Values.namespace.name }}
  labels:
    {{- include "pharma-app.labels" . | nindent 4 }}

spec:
  replicas: {{ .Values.productService.replicaCount }}

  selector:
    matchLabels:
      app: product-service

  template:
    metadata:
      labels:
        app: product-service
        {{- include "pharma-app.selectorLabels" . | nindent 8 }}

    spec:
      containers:
        - name: product-service

          image: "{{ .Values.productService.image.repository }}:{{ .Values.productService.image.tag }}"

          imagePullPolicy: IfNotPresent

          ports:
            - name: http
              containerPort: {{ .Values.productService.service.targetPort }}
              protocol: TCP

          env:
            - name: POSTGRES_HOST
              valueFrom:
                configMapKeyRef:
                  name: app-config
                  key: POSTGRES_HOST

            - name: POSTGRES_PORT
              valueFrom:
                configMapKeyRef:
                  name: app-config
                  key: POSTGRES_PORT

            - name: POSTGRES_DB
              valueFrom:
                secretKeyRef:
                  name: postgres-secret
                  key: POSTGRES_DB

            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: postgres-secret
                  key: POSTGRES_USER

            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: postgres-secret
                  key: POSTGRES_PASSWORD

            - name: DATABASE_URL
              value: "postgresql://$(POSTGRES_USER):$(POSTGRES_PASSWORD)@$(POSTGRES_HOST):$(POSTGRES_PORT)/$(POSTGRES_DB)"

          readinessProbe:
            tcpSocket:
              port: {{ .Values.productService.service.targetPort }}
            initialDelaySeconds: 10
            periodSeconds: 5

          livenessProbe:
            tcpSocket:
              port: {{ .Values.productService.service.targetPort }}
            initialDelaySeconds: 30
            periodSeconds: 10