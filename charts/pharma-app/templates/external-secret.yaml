apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: pharma-db-secret
  namespace: pharma-app
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: pharma-aws-secrets
    kind: ClusterSecretStore
  target:
    name: postgres-secret
    creationPolicy: Owner
    template:
      type: Opaque
      data:
        POSTGRES_USER: "{{ `{{ .username }}` }}"
        POSTGRES_PASSWORD: "{{ `{{ .password }}` }}"
        POSTGRES_DB: "{{ `{{ .dbname }}` }}"
  data:
    - secretKey: username
      remoteRef:
        key: pharma-medinvo/dev/app-db
        property: username
    - secretKey: password
      remoteRef:
        key: pharma-medinvo/dev/app-db
        property: password
    - secretKey: dbname
      remoteRef:
        key: pharma-medinvo/dev/app-db
        property: dbname
