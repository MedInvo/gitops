apiVersion: apps/v1
kind: Deployment
metadata:
  name: order-service
  namespace: {{ .Values.namespace.name }}
  labels:
    {{- include "pharma-app.labels" . | nindent 4 }}

spec:
  replicas: {{ .Values.orderService.replicaCount }}

  selector:
    matchLabels:
      app: order-service

  template:
    metadata:
      labels:
        app: order-service
        {{- include "pharma-app.selectorLabels" . | nindent 8 }}

    spec:
      containers:
        - name: order-service

          image: "{{ .Values.orderService.image.repository }}:{{ .Values.orderService.image.tag }}"

          imagePullPolicy: IfNotPresent

          ports:
            - name: http
              containerPort: {{ .Values.orderService.service.targetPort }}
              protocol: TCP

          env:
            - name: POSTGRES_HOST
              valueFrom:
                configMapKeyRef:
                  name: app-config
                  key: POSTGRES_HOST

            - name: POSTGRES_PORT
              valueFrom:
                configMapKeyRef:
                  name: app-config
                  key: POSTGRES_PORT

            - name: POSTGRES_DB
              valueFrom:
                secretKeyRef:
                  name: postgres-secret
                  key: POSTGRES_DB

            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: postgres-secret
                  key: POSTGRES_USER

            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: postgres-secret
                  key: POSTGRES_PASSWORD

            - name: DATABASE_URL
              value: "postgresql://$(POSTGRES_USER):$(POSTGRES_PASSWORD)@$(POSTGRES_HOST):$(POSTGRES_PORT)/$(POSTGRES_DB)"

            - name: PRODUCT_SERVICE_URL
              value: "http://{{ .Values.config.productServiceHost }}:{{ .Values.config.productServicePort }}"