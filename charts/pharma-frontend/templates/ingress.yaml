
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: pharma-frontend
  namespace: pharma-app
  annotations:
    alb.ingress.kubernetes.io/scheme: internet-facing
    alb.ingress.kubernetes.io/target-type: ip
    alb.ingress.kubernetes.io/listen-ports: '[{"HTTP":80},{"HTTPS":443}]'
    # remove ,{"HTTPS":443}] above add later if you want to enable SSL
    alb.ingress.kubernetes.io/certificate-arn: 'arn:aws:acm:us-east-1:259732629629:certificate/30399c7c-c0fd-4428-b73b-c53d602ad60b'
    alb.ingress.kubernetes.io/ssl-redirect: '443'
    alb.ingress.kubernetes.io/healthcheck-path: /
spec:
  ingressClassName: alb
  rules:
    - http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: frontend
                port:
                  number: 80

